          <h2>一次实验复盘至少回答</h2>
<ul>
  <li>这次实验改变了哪个变量？</li>
  <li>失败发生在感知、规划、控制、执行还是接触阶段？</li>
  <li>有多少样本？是否存在偶然性？</li>
  <li>指标是否支持结论？</li>
  <li>下一次实验应该删掉什么、固定什么、只改变什么？</li>
</ul>
<h2>建议</h2>
<p>每次实验都留一张结果图、一段日志、一条结论和一个下一步动作。</p>
