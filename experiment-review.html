          <h2>建议记录结构</h2>
<ul>
  <li>日期与版本：硬件、环境、代码 commit。</li>
  <li>目标：这次实验要验证什么。</li>
  <li>步骤：命令、路径、参数、配置文件。</li>
  <li>现象：成功输出、报错、截图、日志。</li>
  <li>结论：下次要改什么。</li>
</ul>
<h2>不要只写“成功了”</h2>
<p>对科研更有价值的是失败条件、误差来源和复现路径。</p>
